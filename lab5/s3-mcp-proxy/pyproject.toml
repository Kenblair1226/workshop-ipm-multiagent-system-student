[project]
name = "s3-read-only-mcp-proxy"
version = "0.1.0"
description = "Prefix-bound read-only MCP facade for one S3 bucket"
requires-python = ">=3.13"
dependencies = [
    "boto3==1.43.72",
    "mcp[cli]==2.0.0",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
