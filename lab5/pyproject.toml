[project]
name = "cross-cloud-grounding-lab"
version = "0.1.0"
description = "Provision and validate the Foundry IQ resources used by Lab 5"
requires-python = ">=3.13"
dependencies = [
    "azure-identity==1.25.3",
    "python-dotenv==1.2.2",
    "requests==2.32.5",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
